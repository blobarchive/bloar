services:
  follower:
    # Fail closed until the operator supplies the immutable digest published
    # with a GitHub Release. Tags, including v0.X.Y and latest, are mutable.
    image: ghcr.io/blobarchive/bloar@${BLOAR_IMAGE_DIGEST:?Set BLOAR_IMAGE_DIGEST to the sha256 digest from a verified release}
    restart: unless-stopped
    init: true
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: ${BLOAR_PIDS_LIMIT:-512}
    mem_limit: ${BLOAR_MEMORY_LIMIT:-8g}
    cpus: ${BLOAR_CPUS:-4.0}
    stop_grace_period: 3m
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    command: ["--config", "/etc/bloar/bloard.yaml"]
    healthcheck:
      test: ["CMD", "/bloard", "-config", "/etc/bloar/bloard.yaml", "-healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 5m
      retries: 3
    ports:
      - "127.0.0.1:${BLOAR_HTTP_PORT:-8550}:8550"
      - "127.0.0.1:${BLOAR_METRICS_PORT:-9550}:9550"
      # Direct inbound swarm serving is the useful network contribution of a
      # follower. Allow this TCP port through the host firewall and forward it
      # through the router; set BLOAR_P2P_PORT if host port 4001 is occupied.
      - "${BLOAR_P2P_PORT:-4001}:4001/tcp"
    volumes:
      - type: bind
        source: ./bloard.yaml
        target: /etc/bloar/bloard.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./token
        target: /run/secrets/bloar_token
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data
        target: /var/lib/bloar
        bind:
          create_host_path: false
    # The image declares both role state paths as volumes. Explicitly shadow
    # the unused replica path so Docker cannot create a hidden anonymous
    # writable volume behind read_only.
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=65532,gid=65532,mode=0700
      - /var/lib/bloar-kubo-replica:rw,noexec,nosuid,nodev,size=1m,uid=65532,gid=65532,mode=0700
    logging:
      driver: json-file
      options:
        max-size: ${BLOAR_LOG_MAX_SIZE:-10m}
        max-file: "${BLOAR_LOG_MAX_FILES:-3}"
